      <path d="M8 8.5v6c0 1.5 3.58 2.7 8 2.7s8-1.2 8-2.7v-6"/>
      <path d="M8 14.5v6c0 1.5 3.58 2.7 8 2.7s8-1.2 8-2.7v-6"/>
    </g>
    <ellipse cx="16" cy="8.5" rx="2" ry="0.8" fill="#bef264" opacity="0.5"/>
