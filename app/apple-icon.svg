    </filter>
  </defs>
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  <g transform="translate(90 90) scale(4.5) translate(-16 -16)">
    <g stroke="url(#stroke)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
